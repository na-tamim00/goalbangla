# Netlify Configuration for GoalBangla
[build]
  command = "npm run build:client"
  publish = "dist"

# Optional: Proxy API requests to your production backend server (Cloud Run, Railway, Render, etc.)
# If your backend is hosted separately, set BACKEND_API_URL in Netlify environment variables or uncomment below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service.run.app/api/:splat"
#   status = 200
#   force = true

# Single Page Application (SPA) client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
